name: Validate prompt system

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "series/**"
      - "prompts/**"
      - "config/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/validate-prompt-system.yml"
  push:
    paths:
      - "series/**"
      - "prompts/**"
      - "config/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/validate-prompt-system.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prompt linter
        run: python scripts/prompt-lint.py

      - name: Generate docs
        run: python scripts/prompt-docs.py

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prompt-system-validation
          path: |
            docs/EPISODE_INDEX.md
            docs/SERIES_INDEX.md