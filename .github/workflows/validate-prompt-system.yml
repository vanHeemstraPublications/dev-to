name: Validate prompt system

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "series/**"
      - "prompts/**"
      - "config/**"
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/validate-prompt-system.yml"
  push:
    paths:
      - "series/**"
      - "prompts/**"
      - "config/**"
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/validate-prompt-system.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HOST="${GITHUB_SERVER_URL#https://}"
          HOST="${HOST#http://}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git"

          git init .
          git remote add origin "${REMOTE}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3.12 >/dev/null 2>&1; then
            PYTHON="python3.12"
          else
            PYTHON="python3"
          fi
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"
          $PYTHON --version

      - name: Install dependencies
        run: $PYTHON -m pip install -r requirements.txt

      - name: Run prompt linter
        run: $PYTHON scripts/prompt-lint.py

      - name: Generate docs
        run: $PYTHON scripts/prompt-docs.py

      - name: Package validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -czf prompt-system-validation.tgz docs/EPISODE_INDEX.md docs/SERIES_INDEX.md
          ls -lh prompt-system-validation.tgz

      - name: Publish validation artifact branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="artifacts/prompt-system-validation/${GITHUB_RUN_ID}"

          git checkout --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true

          git add prompt-system-validation.tgz
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(artifacts): prompt system validation ${GITHUB_RUN_ID}"

          git push origin HEAD:"$BRANCH"