name: Generate prompt bundles

on:
  workflow_dispatch:
    inputs:
      series_file:
        description: "Optional path to one series YAML file"
        required: false
        default: ""
      episode_number:
        description: "Optional episode number to generate (only used with series_file)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HOST="${GITHUB_SERVER_URL#https://}"
          HOST="${HOST#http://}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git"

          git init .
          git remote add origin "${REMOTE}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3.12 >/dev/null 2>&1; then
            PYTHON="python3.12"
          else
            PYTHON="python3"
          fi
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"
          $PYTHON --version

      - name: Install dependencies
        run: $PYTHON -m pip install -r requirements.txt

      - name: Generate selected series or all series
        env:
          SERIES_FILE: ${{ github.event.inputs.series_file }}
          EPISODE_NUMBER: ${{ github.event.inputs.episode_number }}
        run: |
          if [ -n "$SERIES_FILE" ]; then
            echo "Generating selected series: $SERIES_FILE"

            if [ -n "$EPISODE_NUMBER" ]; then
              echo "Generating episode: $EPISODE_NUMBER"
              $PYTHON scripts/prompt-cli.py generate "$SERIES_FILE" "$EPISODE_NUMBER"
            else
              $PYTHON scripts/prompt-cli.py generate "$SERIES_FILE"
            fi
          else
            echo "No series_file provided. Generating all series."
            for file in series/*.yaml; do
              if [ "$(basename "$file")" = "SERIES_INDEX.yaml" ]; then
                continue
              fi
              echo "Generating prompt bundles for $file"
              $PYTHON scripts/prompt-cli.py generate "$file"
            done
          fi

      - name: Package generated prompt bundles
        shell: bash
        run: |
          set -euo pipefail
          tar -czf prompt-bundles.tgz generated/
          ls -lh prompt-bundles.tgz

      - name: Publish bundle archive branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="artifacts/prompt-bundles/${GITHUB_RUN_ID}"

          git checkout --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mv prompt-bundles.tgz prompt-bundles.tgz

          git add prompt-bundles.tgz
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(artifacts): prompt bundles ${GITHUB_RUN_ID}"

          git push origin HEAD:"$BRANCH"