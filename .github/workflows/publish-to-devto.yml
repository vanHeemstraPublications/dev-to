name: Publish to DEV.to

on:
  push:
    branches:
      - main
    paths:
      - 'articles/*.md'
      - 'images/*.png'
      - 'images/*.jpg'
      - 'images/*.jpeg'
  workflow_dispatch:

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests python-frontmatter
      
      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed markdown files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'articles/*.md' || echo "")
          
          # If images changed, find articles that reference those images
          CHANGED_IMAGES=$(git diff --name-only HEAD~1 HEAD -- 'images/*.png' 'images/*.jpg' 'images/*.jpeg' 2>/dev/null || echo "")
          if [ -n "$CHANGED_IMAGES" ]; then
            echo "Images changed: $CHANGED_IMAGES"
            # Find articles that reference the changed images
            for img in $CHANGED_IMAGES; do
              img_basename=$(basename "$img")
              # Find articles that reference this image
              matching_articles=$(grep -l "$img_basename" articles/*.md 2>/dev/null || echo "")
              if [ -n "$matching_articles" ]; then
                CHANGED_FILES="$CHANGED_FILES"$'\n'"$matching_articles"
              fi
            done
            # Remove duplicates and empty lines
            CHANGED_FILES=$(echo "$CHANGED_FILES" | grep -v '^$' | sort -u)
          fi
          
          if [ -z "$CHANGED_FILES" ]; then
            # If triggered manually, publish all articles
            CHANGED_FILES=$(find articles -name "*.md" 2>/dev/null || echo "")
          fi
          if [ -z "$CHANGED_FILES" ]; then
            echo "No markdown files to process"
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      
      - name: Publish to DEV.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          FILES_TO_PUBLISH: ${{ steps.changed-files.outputs.files }}
        run: |
          python scripts/publish_to_devto.py
          sleep 5  # Wait 5 seconds between files to void hitting Dev.to’s rate-limit
