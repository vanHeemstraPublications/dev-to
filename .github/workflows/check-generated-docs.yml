name: Check generated docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "series/**"
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/check-generated-docs.yml"
  push:
    paths:
      - "series/**"
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/check-generated-docs.yml"

jobs:
  check-generated-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HOST="${GITHUB_SERVER_URL#https://}"
          HOST="${HOST#http://}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git"

          git init .
          git remote add origin "${REMOTE}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3.12 >/dev/null 2>&1; then
            PYTHON="python3.12"
          else
            PYTHON="python3"
          fi
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"
          $PYTHON --version

      - name: Install dependencies
        run: $PYTHON -m pip install -r requirements.txt

      - name: Regenerate docs
        run: $PYTHON scripts/prompt-docs.py

      - name: Check for uncommitted doc changes
        run: |
          git diff --exit-code docs/EPISODE_INDEX.md docs/SERIES_INDEX.md || (
            echo ""
            echo "Generated docs are out of date."
            echo "Please run:"
            echo "  python3 scripts/prompt-docs.py"
            echo "and commit the updated files:"
            echo "  docs/EPISODE_INDEX.md"
            echo "  docs/SERIES_INDEX.md"
            exit 1
          )