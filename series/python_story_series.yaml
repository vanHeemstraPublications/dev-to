series:
  id: python_story_series
  name: "Like Stories? Love Python!"
  type: python_design_patterns
  orientation: landscape
  resolution: "1930x814"
  aspect_ratio: "1930:814"
  whitespace_margin_percent: 15
  deterministic_config: "config/IMAGE_GENERATION_CONFIG.yaml"
  prompt_template: "prompts/python_story_episode_template.md"
  series_config: "config/like-stories-love-python-series.json"

defaults:
  setting: "Hollywood film set at sunset"
  lighting: "warm cinematic storytelling environment"
  composition:
    left_third: "director or presenter explaining the concept"
    center: "actors demonstrating the design pattern metaphor"
    right_third: "film crew recording the scene"
    background: "Hollywood hills and film studio environment"

episodes:
  - number: 1
    title: "Singleton Pattern"
    slug: "singleton-pattern"
    metaphor: "one unique character controlling access for everyone"
    center_action: "all actors must go through a single gatekeeper"
    supporting_props:
      - "director chair"
      - "clapperboard"
      - "studio camera"
      - "spotlights"

  - number: 2
    title: "Factory Pattern"
    slug: "factory-pattern"
    metaphor: "a producer creating different kinds of actors or props on demand"
    center_action: "a film prop workshop produces different items from one request"
    supporting_props:
      - "prop shelves"
      - "workshop table"
      - "script pages"
      - "film crates"

  - number: 3
    title: "Builder Pattern"
    slug: "builder-pattern"
    metaphor: "a set being assembled in deliberate stages"
    center_action: "crew members build the scene piece by piece"
    supporting_props:
      - "blueprints"
      - "set walls"
      - "tool cart"
      - "clapperboard"

  - number: 4
    title: "Adapter Pattern"
    slug: "adapter-pattern"
    metaphor: "a translator helping two incompatible systems work together"
    center_action: "a character connects mismatched film equipment so the scene can continue"
    supporting_props:
      - "cables"
      - "connectors"
      - "monitor"
      - "lighting rig"

  - number: 5
    title: "Decorator Pattern"
    slug: "decorator-pattern"
    metaphor: "a plain costume gaining more layers and features"
    center_action: "an actor is progressively enhanced with wardrobe and accessories"
    supporting_props:
      - "costume rack"
      - "makeup station"
      - "wardrobe cart"
      - "mirror lights"

  - number: 6
    title: "Observer Pattern"
    slug: "observer-pattern"
    metaphor: "multiple people watching one key event and reacting instantly"
    center_action: "crew members and actors react when a central signal changes"
    supporting_props:
      - "control panel"
      - "monitors"
      - "boom mic"
      - "signal light"

  - number: 7
    title: "Strategy Pattern"
    slug: "strategy-pattern"
    metaphor: "different teams switching tactics to solve the same challenge"
    center_action: "actors test different approaches for filming the same scene"
    supporting_props:
      - "alternate scripts"
      - "storyboards"
      - "director notes"
      - "camera dolly"

  - number: 8
    title: "Command Pattern"
    slug: "command-pattern"
    metaphor: "instructions packaged and handed off for others to execute"
    center_action: "a director issues action cards that trigger different crew actions"
    supporting_props:
      - "call sheets"
      - "cue cards"
      - "walkie-talkies"
      - "clapperboard"

  - number: 9
    title: "Facade Pattern"
    slug: "facade-pattern"
    metaphor: "a single studio front desk simplifying access to many departments"
    center_action: "the presenter uses one reception desk to coordinate lighting, costumes, and props"
    supporting_props:
      - "studio reception desk"
      - "department signs"
      - "walkie-talkies"
      - "production clipboard"

  - number: 10
    title: "Proxy Pattern"
    slug: "proxy-pattern"
    metaphor: "a stunt double standing in for a movie star"
    center_action: "a stunt performer temporarily replaces the main actor during filming"
    supporting_props:
      - "director chair"
      - "camera crane"
      - "stunt safety mats"
      - "clapperboard"

  - number: 11
    title: "Chain of Responsibility Pattern"
    slug: "chain-of-responsibility-pattern"
    metaphor: "a script request passing through several film crew members until someone handles it"
    center_action: "crew members pass a request along until the right department resolves it"
    supporting_props:
      - "script folders"
      - "assistant director headset"
      - "production desk"
      - "message clipboard"

  - number: 12
    title: "Mediator Pattern"
    slug: "mediator-pattern"
    metaphor: "a director coordinating communication between actors and crew"
    center_action: "the director orchestrates interactions so actors do not talk directly to every crew member"
    supporting_props:
      - "director megaphone"
      - "studio monitors"
      - "boom microphone"
      - "film crew headsets"

  - number: 13
    title: "State Pattern"
    slug: "state-pattern"
    metaphor: "a film set changing behavior depending on whether filming, rehearsing, or resetting"
    center_action: "the crew changes how they behave depending on the current filming state"
    supporting_props:
      - "studio signal light"
      - "camera rig"
      - "director slate"
      - "stage lighting controls"

  - number: 14
    title: "Template Method Pattern"
    slug: "template-method-pattern"
    metaphor: "a standard film production workflow reused across different scenes"
    center_action: "crew follows the same filming sequence but adapts certain steps for each scene"
    supporting_props:
      - "production checklist"
      - "scene storyboard"
      - "film slate"
      - "camera setup diagram"

  - number: 15
    title: "Visitor Pattern"
    slug: "visitor-pattern"
    metaphor: "a film critic visiting different departments to analyze their work"
    center_action: "a critic moves between departments evaluating different aspects of the production"
    supporting_props:
      - "critic notebook"
      - "studio tour badge"
      - "film lighting rig"
      - "camera dolly"      