series:
  id: container_harbour_series
  name: "Welcome to container harbour!"
  type: kubernetes_explainer_series
  orientation: landscape
  resolution: "1000x420"
  aspect_ratio: "100:42"
  whitespace_margin_percent: 24
  deterministic_config: "config/IMAGE_GENERATION_CONFIG.yaml"
  prompt_template: "prompts/kubernetes_episode_template.md"
  series_config: "config/welcome-to-container-harbour-series.json"

defaults:
  setting: "Titanic-era container harbour at golden sunset"
  lighting: "warm cinematic maritime atmosphere"
  composition:
    left_third: "harbour captain presenter"
    center: "dock activity and container metaphor"
    right_third: "crane lifting cargo"
    background: "steamship and harbor skyline"

episodes:
  - number: 1
    title: "What is Kubernetes, really?"
    slug: "what-is-kubernetes-really"
    metaphor: "a harbor coordinating many containers and ships"
    center_action: "cargo is organized and routed across the harbor"
    supporting_props:
      - "shipping ledger"
      - "ropes"
      - "dock carts"
      - "stacked cargo"

  - number: 2
    title: "Pods — Ships in the Harbour"
    slug: "pods-ships-in-the-harbour"
    metaphor: "pods as grouped units traveling together"
    center_action: "containers are grouped together on the same vessel"
    supporting_props:
      - "cargo net"
      - "grouped crates"
      - "dock workers"
      - "manifest clipboard"

  - number: 3
    title: "Deployments — Shipping Schedules"
    slug: "deployments-shipping-schedules"
    metaphor: "deployments as planned recurring shipping operations"
    center_action: "the harbor manager schedules repeated ship departures"
    supporting_props:
      - "harbor timetable board"
      - "captain whistle"
      - "schedule ledger"
      - "departure bell"

  - number: 4
    title: "Services — Harbour Traffic Control"
    slug: "services-harbour-traffic-control"
    metaphor: "services as stable routes directing traffic to the right destination"
    center_action: "incoming cargo is routed to the correct dock"
    supporting_props:
      - "signal flags"
      - "direction signs"
      - "routing desk"
      - "control tower lamp"

  - number: 5
    title: "Ingress — The Harbour Gate"
    slug: "ingress-the-harbour-gate"
    metaphor: "ingress as the guarded gateway that decides what may enter"
    center_action: "ships are directed through one official harbor entrance"
    supporting_props:
      - "harbor gate"
      - "customs booth"
      - "entry stamps"
      - "lantern posts"

  - number: 6
    title: "Autoscaling — Expanding the Fleet"
    slug: "autoscaling-expanding-the-fleet"
    metaphor: "autoscaling as adding or removing ships depending on demand"
    center_action: "more vessels are called in as harbor traffic increases"
    supporting_props:
      - "signal flare"
      - "reserve tugboats"
      - "traffic counter"
      - "dispatch board"

  - number: 7
    title: "Self-Healing — Repairing the Fleet"
    slug: "self-healing-repairing-the-fleet"
    metaphor: "self-healing as quickly replacing damaged ships or cargo operations"
    center_action: "a broken vessel is swapped out without stopping the harbor"
    supporting_props:
      - "repair tools"
      - "dry dock"
      - "replacement ship"
      - "maintenance crew"

  - number: 8
    title: "Namespaces — Docks Within the Harbour"
    slug: "namespaces-docks-within-the-harbour"
    metaphor: "namespaces as clearly separated dock zones inside one harbor"
    center_action: "different teams work in separate dock sections without interference"
    supporting_props:
      - "zone signs"
      - "painted dock boundaries"
      - "cargo labels"
      - "team uniforms"

  - number: 9
    title: "ConfigMaps — Harbour Notice Boards"
    slug: "configmaps-harbour-notice-boards"
    metaphor: "shared harbour notice boards displaying operational information for crews"
    center_action: "dock workers read configuration instructions posted on a large harbour notice board"
    supporting_props:
      - "harbour notice board"
      - "pinned instruction sheets"
      - "dock workers reading notices"
      - "harbour control clipboard"

  - number: 10
    title: "Secrets — The Captain's Locked Safe"
    slug: "secrets-the-captains-locked-safe"
    metaphor: "sensitive harbour information stored securely in the captain’s safe"
    center_action: "the harbour captain unlocks a secure safe containing confidential navigation documents"
    supporting_props:
      - "locked safe"
      - "sealed envelopes"
      - "captain keyring"
      - "confidential cargo manifest"

  - number: 11
    title: "Volumes — The Cargo Warehouse"
    slug: "volumes-the-cargo-warehouse"
    metaphor: "cargo warehouses storing goods independently of ships"
    center_action: "containers unload cargo into a dockside warehouse where it remains even if ships leave"
    supporting_props:
      - "warehouse building"
      - "stacked crates"
      - "dock forklifts"
      - "cargo inventory ledger"

  - number: 12
    title: "Persistent Volumes — Permanent Harbour Storage"
    slug: "persistent-volumes-permanent-harbour-storage"
    metaphor: "permanent harbour storage facilities used by many ships"
    center_action: "ships repeatedly load and unload cargo from a large permanent storage facility"
    supporting_props:
      - "large cargo depot"
      - "dock cranes"
      - "cargo pallets"
      - "shipping labels"

  - number: 13
    title: "Nodes — The Harbour Piers"
    slug: "nodes-the-harbour-piers"
    metaphor: "piers where ships dock and operate"
    center_action: "multiple ships dock at different piers where crews unload containers"
    supporting_props:
      - "harbour piers"
      - "mooring ropes"
      - "dock cranes"
      - "cargo carts"

  - number: 14
    title: "Cluster — The Entire Harbour"
    slug: "cluster-the-entire-harbour"
    metaphor: "the whole harbour system coordinating ships, piers, warehouses, and traffic"
    center_action: "a panoramic view of the harbour showing ships docking, cranes moving cargo, and the harbour master coordinating activity"
    supporting_props:
      - "harbour master tower"
      - "signal flags"
      - "multiple piers"
      - "cargo ships"

  - number: 15
    title: "Helm — The Harbour Blueprint"
    slug: "helm-the-harbour-blueprint"
    metaphor: "a blueprint used to quickly construct identical harbour installations"
    center_action: "engineers unroll architectural blueprints showing how to replicate an entire harbour setup"
    supporting_props:
      - "rolled blueprints"
      - "construction tools"
      - "harbour scale model"
      - "engineer drafting table"

  - number: 16
    title: "The Shipyard Foreman"
    slug: "the-shipyard-foreman"
    metaphor: "Jenkins on Kubernetes is like a shipyard foreman assigning each build its own temporary dock crew and workspace"
    center_action: "dispatching a fresh build crew to a temporary dock that vanishes when the job is done"
    supporting_props:
      - "temporary dock"
      - "clipboards"
      - "tool crates"
      - "harbour scheduler"
