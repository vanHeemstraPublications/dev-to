series:
  id: python_story_series
  name: Like Stories? Love Python!
  orientation: landscape
  resolution: 1792x1024
  aspect_ratio: 16:9

episodes:

  - number: 1
    title: Singleton Pattern
    slug: singleton-pattern
    metaphor: one unique character controlling access
    center_action: actors must pass through one gatekeeper
    supporting_props:
      - director chair
      - clapperboard
      - studio camera

  - number: 2
    title: Factory Pattern
    slug: factory-pattern
    metaphor: a prop workshop producing objects
    center_action: a machine produces different props
    supporting_props:
      - prop shelves
      - workshop table

  - number: 3
    title: Builder Pattern
    slug: builder-pattern
    metaphor: set assembled in stages
    center_action: crew constructs scene piece by piece
    supporting_props:
      - blueprints
      - tool cart

  - number: 4
    title: Adapter Pattern
    slug: adapter-pattern
    metaphor: translator connecting incompatible tools
    center_action: mismatched equipment connected
    supporting_props:
      - cables
      - monitor

  - number: 5
    title: Decorator Pattern
    slug: decorator-pattern
    metaphor: costume gaining extra layers
    center_action: actor enhanced with accessories
    supporting_props:
      - wardrobe cart
      - mirror lights

  - number: 6
    title: Observer Pattern
    slug: observer-pattern
    metaphor: multiple watchers reacting to signal
    center_action: crew reacts to central signal
    supporting_props:
      - monitors
      - signal light

  - number: 7
    title: Strategy Pattern
    slug: strategy-pattern
    metaphor: switching tactics to solve challenge
    center_action: actors test different approaches
    supporting_props:
      - storyboards
      - director notes

  - number: 8
    title: Command Pattern
    slug: command-pattern
    metaphor: instructions passed as action cards
    center_action: director triggers crew actions
    supporting_props:
      - cue cards
      - walkie-talkies